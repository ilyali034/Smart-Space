[project]
name = "smart-space-desktop"
version = "0.1.0"
description = "Smart Space Desktop — JARVIS Edition (Windows client for the Smart Space backend)"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.6",
    "httpx>=0.27",
    "keyring>=25",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4"]

[project.gui-scripts]
smart-space-desktop = "smart_space_desktop.main:main"

[tool.setuptools.packages.find]
include = ["smart_space_desktop*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
