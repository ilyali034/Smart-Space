[project]
name = "smart-space-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "sqlalchemy[asyncio]>=2.0.30",
  "asyncpg>=0.29",
  "pydantic>=2.6",
  "alembic>=1.13",
  "aiomqtt>=2.3,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "httpx>=0.27", "import-linter>=2.0", "mypy>=1.10"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
asyncio_default_test_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.importlinter]
root_package = "backend_engine"

[[tool.importlinter.contracts]]
name = "shared does not import modules or api"
type = "forbidden"
source_modules = ["backend_engine.shared"]
forbidden_modules = ["backend_engine.modules", "backend_engine.api"]

[[tool.importlinter.contracts]]
name = "modules do not import api"
type = "forbidden"
source_modules = ["backend_engine.modules"]
forbidden_modules = ["backend_engine.api"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
